<style>
    :root {
        --c1: #eb7f22;
        --c2: #e48e41;
        --c3: #1a9dd7;
        --c4: #51b74b;
        --c5: #f0f9f5;
        --c8: #b5dfed;
    }

    /* .add-card {
        background: white;
        padding: 25px;
        border-radius: 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        border-left: 6px solid var(--c4);
        max-width: 850px;
        margin: auto;
        margin-top: 20px;
    } */

    .add-card h2 {
        color: var(--c3);
        margin-bottom: 20px;
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    table td {
        padding: 10px;
        vertical-align: top;
    }

    table td:first-child {
        width: 200px;
        font-weight: bold;
        color: var(--c3);
    }

    input[type="text"],
    input[type="date"],
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #dcdcdc;
        border-radius: 8px;
        font-size: 14px;
    }

    textarea {
        height: 90px;
        resize: vertical;
    }

    .btn-save {
        margin-top: 20px;
        background: var(--c1);
        padding: 10px 20px;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
    }

    .btn-save:hover {
        background: var(--c2);
    }

    .btn-back {
        margin-left: 10px;
        padding: 10px 15px;
        background: #777;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }

    .file-input {
        background: #fff;
        border: 1px solid #dcdcdc;
        padding: 10px;
        border-radius: 8px;
        width: 100%;
    }
    /* ส่วนของอัพไฟล์ */

    .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    }

    /* modal box */
    .modal-box {
        background: var(--c5);     
        padding: 25px 30px;
        border-radius: 14px;
        width: 360px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        animation: pop 0.25s ease;
    }

    .modal-box h3 {
        margin-bottom: 10px;
    }

    .modal-box input[type="file"] {
        margin: 15px 0;
        background: white;
        padding: 6px;
        border-radius: 6px;
        width: 100%;
    }

    /* buttons */
    .modal-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    .btn-upload {
        background: #ffffff;
        color: #b3261e;
        border: none;
        padding: 8px 18px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-cancel {
        background: transparent;
        border: 1px solid #fff;
        color: white;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
    }

    /* animation */
    @keyframes pop {
        from { transform: scale(0.9); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
    }






</style>

<div class="add-card">
    <h2>Add New Product</h2>

        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;">
            <button type="button" class="btn-save" onclick="openCsvModal()">
                Import CSV
            </button>
    
            <button type="button" class="btn-save" style="background:var(--c4)" onclick="showMode('manual')">
                Add Manual
            </button>
        </div>

<div id="csvModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Upload ไฟล์</h3>

        <p>กรุณาเลือกไฟล์ <b>.csv,.xlsx</b></p>

        <form action="{{ url_for('import_csv') }}" method="POST" enctype="multipart/form-data">

            <input type="file" name="csv_file" accept=".csv,.xlsx" required>

            <div class="modal-actions">
                <button type="submit" class="btn-upload">Upload</button>
                <button type="button" class="btn-cancel" onclick="closeCsvModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>
    

<script>

    function openCsvModal() {
        document.getElementById("csvModal").style.display = "flex";
    }

    function closeCsvModal() {
        document.getElementById("csvModal").style.display = "none";
    }

    function showMode(mode) {
    //     document.getElementById("csvForm").style.display =
    //         mode === "csv" ? "block" : "none";

        document.getElementById("manualForm").style.display =
            mode === "manual" ? "block" : "none";
    }
</script>
